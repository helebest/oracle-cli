services:
  hermes:
    build:
      context: .
      args:
        # Pin upstream Hermes Agent release. Keep in sync with the ARG default
        # in Dockerfile; either side wins because compose passes this through.
        HERMES_VERSION: v2026.6.5
    image: hermes-agent:v2026.6.5
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    command: gateway run
    env_file: .env
    volumes:
      - ./data:/opt/data
      - obsidian-vault:/opt/data/vault/secondbrain
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "3.0"

volumes:
  obsidian-vault:
    external: true
    name: obsidian-sync_obsidian-vault
